name: Daily forecast

# Runs every day at 05:41 IST (00:11 UTC), plus a manual "Run workflow" button.
on:
  schedule:
    - cron: "11 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make forecast
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python -m smogcast forecast
      - name: Commit outputs
        run: |
          git config user.name "smogcast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet || git commit -m "Forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
